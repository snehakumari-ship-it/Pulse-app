name: Architecture Check

on:
  pull_request:

jobs:
  boundaries:
    name: Domain boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint -- --quiet
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  circular-deps:
    name: Circular dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check for circular dependencies
        run: |
          npx madge --circular --extensions ts,tsx . \
            --exclude 'node_modules|dist|\.expo|\.metro-cache|playwright-report' \
            --ts-config tsconfig.json
        # Known pre-existing cycles (do not add new ones):
        # 1. features/drivers/components/AddDriverModal <-> DriverRegistrationPortalFlow
        # 2. features/drivers/services/drivers.service <-> driverInviteCompensation.util
        # 3. features/trips/services/tripOtp.service <-> trips.service
        # 4. lib/contactPicker <-> lib/contactPickerNative
        # 5. lib/contactPicker <-> lib/contactPickerWeb

  lib-size-check:
    name: lib/ root file count gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce lib/ root file limit (max 60)
        run: |
          count=$(find lib -maxdepth 1 \( -name "*.ts" -o -name "*.tsx" \) | wc -l | tr -d ' ')
          echo "lib/ root has $count files (limit: 60)"
          [ "$count" -le 60 ] || (echo "❌ lib/ root exceeds 60 files — move domain-specific files to features/" && exit 1)

  pulse-v2-isolation:
    name: Pulse V2 isolation (first slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: V2 env denylist, in-process Gateway, domain table guard
        run: npm run test:v2
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  navigation-policy:
    name: Navigation policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Coverage, overlap, auth-replace ban, evaluate
        run: npm run test:navigation-policy
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  typecheck:
    name: App TypeScript (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  unit-tests:
    name: App unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: jest
        run: npm test -- --ci --passWithNoTests
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
