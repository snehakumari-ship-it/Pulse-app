name: Architecture Check

on:
  pull_request:

jobs:
  boundaries:
    name: Domain boundary lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: ESLint errors must not exceed baseline (.github/ci-baseline.json)
        run: node scripts/ci-baseline.js lint
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  circular-deps:
    name: Circular dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Circular dependencies must not exceed baseline (.github/ci-baseline.json)
        run: node scripts/ci-baseline.js cycles

  lib-size-check:
    name: lib/ root file count gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Target is 60; baseline only ratchets down. New domain files go in features/<domain>/.
      - name: lib/ root file count must not exceed baseline (.github/ci-baseline.json)
        run: node scripts/ci-baseline.js lib-files

  pulse-v2-isolation:
    name: Pulse V2 isolation (first slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: V2 env denylist, in-process Gateway, domain table guard
        run: npm run test:v2
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  navigation-policy:
    name: Navigation policy gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Coverage, overlap, auth-replace ban, evaluate
        run: npm run test:navigation-policy
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

  typecheck:
    name: App TypeScript (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: tsc errors must not exceed baseline (.github/ci-baseline.json)
        run: node scripts/ci-baseline.js typecheck
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'

  unit-tests:
    name: App unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: jest
        run: npm test -- --ci --passWithNoTests
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
